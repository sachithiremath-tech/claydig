<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#182d2b">
  <meta name="description" content="Dig into a daily 10-question trivia challenge or practice for a deeper score.">
  <title>Claydig — Daily Trivia Dive</title>
  <style>
    :root{--ink:#182d2b;--muted:#64736a;--paper:#fbf8ef;--panel:#fffdf8;--soil:#70452e;--clay:#d9875b;--moss:#71866a;--line:#e8dfce;--gold:#efbd61;--danger:#a94336;--shadow:0 24px 70px rgba(37,46,35,.12)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);background:radial-gradient(ellipse at 50% -20%,#e8d6b7 0,transparent 52%),var(--paper);font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:3px}.shell{width:min(100% - 32px,760px);margin:0 auto;padding:28px 0 36px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:11px;color:var(--ink);text-decoration:none}.brand-mark{display:grid;width:43px;height:43px;place-items:center;border-radius:14px;background:var(--ink);color:#f7d99c;font-size:23px}.brand-name{font-size:19px;font-weight:900;letter-spacing:.14em}.date-chip{padding:9px 13px;border:1px solid var(--line);border-radius:999px;background:rgba(255,253,248,.7);color:var(--muted);font-size:12px;font-weight:750}main{overflow:hidden;border:1px solid rgba(112,69,46,.12);border-radius:28px;background:var(--panel);box-shadow:var(--shadow)}.hero{padding:clamp(24px,6vw,48px);text-align:center}.eyebrow{margin:0 0 11px;color:var(--soil);font-size:11px;font-weight:900;letter-spacing:.18em;text-transform:uppercase}h1{margin:0;font-size:clamp(38px,9vw,64px);line-height:.98;letter-spacing:-.055em}.intro{max-width:470px;margin:16px auto 0;color:var(--muted);font-size:16px;line-height:1.65}.how{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:22px auto 28px}.how span{padding:8px 11px;border-radius:999px;background:#f3eee3;color:#59665a;font-size:12px;font-weight:750}.mode-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;max-width:510px;margin:0 auto}.mode-card{min-height:155px;padding:19px;border:1px solid var(--line);border-radius:19px;background:#fff;text-align:left;transition:transform .18s,border-color .18s,box-shadow .18s}.mode-card:hover{transform:translateY(-3px);border-color:#c8a47c;box-shadow:0 10px 24px #70452e14}.mode-icon{display:block;margin-bottom:12px;font-size:25px}.mode-card strong{display:block;font-size:16px}.mode-card small{display:block;margin-top:6px;color:var(--muted);line-height:1.5}.notice{max-width:510px;margin:20px auto 0;color:#7d8277;font-size:11px;line-height:1.55}.game{padding:clamp(21px,5vw,38px)}.game-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}.mode-label{color:var(--soil);font-size:11px;font-weight:900;letter-spacing:.15em;text-transform:uppercase}.quit{border:0;padding:8px 10px;border-radius:10px;background:transparent;color:var(--muted);font-size:13px;font-weight:750}.quit:hover{background:#f3eee3;color:var(--ink)}.meta-row{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:13px;font-weight:750}.progress-track{height:8px;overflow:hidden;margin:10px 0 25px;border-radius:99px;background:#eee8dc}.progress-bar{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--moss),#b2a46d);transition:width .3s ease}.timer-row{display:flex;justify-content:center;margin:0 0 13px}.timer{display:flex;align-items:center;gap:7px;padding:7px 12px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:12px;font-weight:800}.timer.urgent{border-color:#e6b2a9;background:#fff2ef;color:var(--danger)}.question{max-width:580px;min-height:100px;display:grid;place-items:center;margin:0 auto;text-align:center;font-size:clamp(24px,5.8vw,37px);font-weight:850;line-height:1.16;letter-spacing:-.035em}.hint{margin:10px 0 20px;text-align:center;color:var(--muted);font-size:13px}.answer-form{display:flex;gap:9px;max-width:520px;margin:0 auto}.answer-input{min-width:0;flex:1;padding:14px 15px;border:1px solid #dcd3c4;border-radius:13px;background:#fff;color:var(--ink)}.answer-input::placeholder{color:#9a9d94}.primary{border:0;border-radius:13px;padding:0 19px;background:var(--ink);color:white;font-weight:850;transition:background .16s,transform .16s}.primary:hover{transform:translateY(-1px);background:#294441}.feedback{min-height:83px;max-width:520px;margin:17px auto 0;padding:14px 15px;border:1px solid transparent;border-radius:14px;line-height:1.5;text-align:center}.feedback[hidden]{display:none}.feedback.good{border-color:#d5e0ce;background:#f2f7ef;color:#344a35}.feedback.miss{border-color:#ead9c7;background:#faf4eb;color:#6a4b35}.feedback strong{display:block;margin-bottom:3px}.tiers{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin:21px 0 0}.tier-chip{padding:7px 9px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:10px;font-weight:850}.tier-chip.active{border-color:#d3a26b;background:#fbf0dc;color:#714624}.result{padding:clamp(25px,6vw,45px);text-align:center}.result-emoji{font-size:44px}.result h2{margin:8px 0;font-size:clamp(30px,7vw,44px);letter-spacing:-.04em}.result-copy{margin:0 auto 23px;color:var(--muted);line-height:1.6}.score-big{display:inline-flex;align-items:baseline;gap:7px;margin:4px 0 20px;color:var(--soil)}.score-big strong{font-size:45px;letter-spacing:-.06em}.score-big span{font-size:13px;font-weight:800}.result-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;max-width:440px;margin:0 auto 22px}.result-cell{padding:11px 4px;border:1px solid var(--line);border-radius:12px;background:#fff}.result-cell strong{display:block;font-size:12px}.result-cell small{display:block;margin-top:4px;color:var(--muted);font-size:10px}.result-actions{display:flex;justify-content:center;flex-wrap:wrap;gap:9px}.result-actions .primary,.secondary{min-height:45px;padding:0 16px}.secondary{border:1px solid var(--line);border-radius:13px;background:white;color:var(--ink);font-weight:800}.secondary:hover{background:#f6f1e7}footer{padding:17px 5px 0;text-align:center;color:#85877d;font-size:11px;line-height:1.6}footer a{color:var(--soil);font-weight:700}@media(max-width:520px){.shell{width:min(100% - 20px,760px);padding-top:14px}header{margin-bottom:14px}.date-chip{padding:8px 10px;font-size:10px}main{border-radius:22px}.mode-grid{grid-template-columns:1fr}.mode-card{min-height:125px}.answer-form{flex-direction:column}.answer-input{min-height:50px}.primary{min-height:48px}.result-grid{gap:4px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important}}
  </style>
</head>
<body><div class="shell"><header><a class="brand" href="#" aria-label="Claydig home" id="home-link"><span class="brand-mark" aria-hidden="true">⛏</span><span class="brand-name">CLAYDIG</span></a><span class="date-chip" id="today-label"></span></header><main id="app" aria-live="polite"></main><footer>Rarity tiers are curated estimates, not live player statistics. Answers are checked against this game's answer bank.<br>Your daily result is saved only in this browser. <a href="https://github.com/sachithiremath-tech/claydig">View the project on GitHub</a></footer></div>
<script>
(() => {
'use strict';
// Five tiers per question, from common to increasingly niche accepted answers.
const QUESTIONS=[
{q:'Name a planet in our solar system',tiers:[['mercury','venus','earth','mars'],['jupiter','saturn'],['neptune','uranus'],[],[]]},
{q:'Name a chemical element',tiers:[['oxygen','carbon','iron','gold'],['silver','copper','helium'],['titanium','neon','nickel'],['xenon','bismuth'],['osmium','californium']]},
{q:'Name a type of rock or mineral',tiers:[['granite','quartz','marble'],['obsidian','basalt','limestone'],['pumice','schist','gneiss'],['kimberlite','coquina'],['larvikite','unakite']]},
{q:'Name a mammal',tiers:[['dog','cat','horse','elephant'],['dolphin','tiger','kangaroo'],['platypus','wombat','okapi'],['narwhal','aardvark'],['tenrec','binturong']]},
{q:'Name a bird',tiers:[['robin','eagle','owl','pigeon'],['toucan','puffin','flamingo'],['kakapo','shoebill','hoatzin'],['kagu','secretarybird'],['oilbird','lyrebird']]},
{q:'Name a European country',tiers:[['france','italy','spain','germany'],['portugal','norway','poland'],['albania','estonia','slovenia'],['andorra','liechtenstein'],['san marino','vatican city']]},
{q:'Name a capital city in Europe',tiers:[['paris','rome','madrid','berlin'],['lisbon','prague','vienna'],['tirana','podgorica','riga'],['vaduz','andorra la vella'],['san marino','vatican city']]},
{q:'Name a Shakespeare play',tiers:[['hamlet','macbeth','romeo and juliet'],['othello','king lear','the tempest'],['cymbeline','pericles'],['timon of athens','coriolanus'],['the two noble kinsmen']]},
{q:'Name an ancient civilization',tiers:[['roman','egyptian','greek'],['maya','aztec','inca'],['sumerian','phoenician'],['etruscan','moche'],['harappan','nuragic']]},
{q:'Name a language spoken in Africa',tiers:[['swahili','arabic','english','french'],['yoruba','amharic','zulu'],['hausa','igbo','somali'],['wolof','berber','tigrinya'],['ndebele','sango']]},
{q:'Name a tree',tiers:[['oak','maple','pine','willow'],['birch','cedar','sequoia'],['baobab','ginkgo','larch'],['alder','rowan','yew'],['wollemia','cercis']]},
{q:'Name a constellation',tiers:[['orion','ursa major','cassiopeia'],['cygnus','draco','andromeda'],['lyra','perseus','pegasus'],['apus','circinus'],['mensa','caelum']]},
{q:'Name a dinosaur',tiers:[['tyrannosaurus rex','stegosaurus','triceratops'],['velociraptor','brachiosaurus','ankylosaurus'],['allosaurus','iguanodon','parasaurolophus'],['therizinosaurus','microraptor'],['concavenator','nothronychus']]},
{q:'Name a board game',tiers:[['chess','checkers','monopoly'],['scrabble','clue','catan'],['carcassonne','azul','ticket to ride'],['patchwork','root'],['tigris and euphrates','ra']]},
{q:'Name a musical instrument',tiers:[['piano','guitar','violin','drums'],['harp','oboe','cello'],['sitar','theremin','didgeridoo'],['hang','nyckelharpa'],['crwth','serpent']]},
{q:'Name an African country',tiers:[['nigeria','egypt','south africa','kenya'],['ghana','senegal','morocco'],['benin','lesotho','djibouti'],['comoros','eritrea'],['sao tome and principe','eswatini']]},
{q:'Name a moon in our solar system',tiers:[['the moon','luna'],['europa','titan','phobos'],['enceladus','io','triton'],['miranda','mimas','charon'],['hyperion','nereid']]},
{q:'Name a sea',tiers:[['mediterranean sea','caribbean sea','north sea'],['red sea','black sea','baltic sea'],['sea of japan','arabian sea','coral sea'],['weddell sea','labrador sea'],['chukchi sea','sargasso sea']]},
{q:'Name a space mission',tiers:[['apollo 11','voyager 1','hubble'],['cassini','curiosity','perseverance'],['juno','osiris rex','dawn'],['hayabusa2','rosetta'],['ikaros','deep impact']]},
{q:'Name a figure from Greek mythology',tiers:[['zeus','hercules','athena'],['persephone','odysseus','icarus'],['hecate','daedalus','orpheus'],['ariadne','atalanta'],['bellerophon','oeneus']]},
{q:'Name a spice',tiers:[['pepper','cinnamon','ginger'],['turmeric','cardamom','cumin'],['sumac','fenugreek','mace'],['asafoetida','grains of paradise'],['long pepper','cubeb']]},
{q:'Name a gemstone',tiers:[['diamond','ruby','sapphire'],['opal','garnet','amethyst'],['peridot','spinel','tourmaline'],['iolite','chrysoberyl'],['benitoite','painite']]},
{q:'Name a famous explorer',tiers:[['christopher columbus','marco polo'],['ibn battuta','roald amundsen'],['zheng he','sacagawea'],['mungo park','freya stark'],['ahmad ibn fadlan','jean baptiste charcot']]},
{q:'Name a type of cloud',tiers:[['cumulus','cirrus'],['stratus','cumulonimbus'],['altostratus','altocumulus'],['nimbostratus','cirrostratus'],['noctilucent','pileus']]},
{q:'Name a planet in a science-fiction story',tiers:[['tatooine','krypton'],['arrakis','vulcan'],['pandora','endor'],['terminus','trantor'],['gallifrey','earthsea']]},
{q:'Name a classical composer',tiers:[['mozart','beethoven','bach'],['chopin','vivaldi','tchaikovsky'],['mahler','ravel','debussy'],['satie','holst','dvorak'],['lili boulanger','caroline shaw']]},
{q:'Name a type of pasta',tiers:[['spaghetti','penne','macaroni'],['farfalle','rigatoni','ravioli'],['orecchiette','cavatappi','paccheri'],['trofie','malloreddus'],['sagne ncannulate','su filindeu']]},
{q:'Name a volcano',tiers:[['mount vesuvius','mount etna'],['krakatoa','mauna loa','mount fuji'],['eyjafjallajokull','cotopaxi'],['ol doinyo lengai','mount pelée'],['taal','cerro azul']]},
{q:'Name a precious or ornamental wood',tiers:[['oak','mahogany'],['teak','ebony','rosewood'],['bubinga','zebrawood'],['lignum vitae','snakewood'],['amboyna burl','blackwood']]},
{q:'Name a character in Alice’s Adventures in Wonderland',tiers:[['alice','white rabbit'],['cheshire cat','mad hatter','queen of hearts'],['dormouse','caterpillar'],['mock turtle','march hare'],['knave of hearts']]}
];
const NAMES=['Clay','Silt','Shale','Fossil','Bedrock'],POINTS=[100,250,450,700,1000],SIZE=10,SECONDS=20,app=document.getElementById('app'),now=new Date(),dateKey=`${now.getUTCFullYear()}-${String(now.getUTCMonth()+1).padStart(2,'0')}-${String(now.getUTCDate()).padStart(2,'0')}`,storageKey=`claydig-daily-${dateKey}`;
document.getElementById('today-label').textContent=`DAILY DIG · ${now.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric',timeZone:'UTC'})} UTC`;
let run=null,tick=null,answered=false;
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let a=seed>>>0;return()=>{a+=0x6D2B79F5;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}}
function choose(seed){let a=QUESTIONS.map((_,i)=>i),r=rng(seed);for(let i=a.length-1;i>0;i--){let j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,SIZE)}
function saved(){try{return JSON.parse(localStorage.getItem(storageKey)||'null')}catch{return null}}
function stop(){if(tick)clearInterval(tick);tick=null}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function home(){stop();run=null;let done=saved();app.innerHTML=`<section class="hero"><p class="eyebrow">A little trivia. A lot of depth.</p><h1>How deep<br>can you dig?</h1><p class="intro">Ten quick-fire questions. Think past the obvious, find the deep cuts, and see how far your answers take you.</p><div class="how"><span>10 questions</span><span>20 seconds each</span><span>Up to 10,000m</span></div><div class="mode-grid"><button class="mode-card" id="daily-btn"><span class="mode-icon">🌞</span><strong>${done?'See today’s result':'Today’s daily dive'}</strong><small>${done?`Already dug ${done.score}m today. Check your result.`:'One shared set each day. Your score is saved in this browser.'}</small></button><button class="mode-card" id="practice-btn"><span class="mode-icon">🪨</span><strong>Practice mode</strong><small>Play again anytime with a fresh random set of ten questions.</small></button></div><p class="notice">Daily questions are selected from a built-in bank, so everyone gets the same set for the UTC date. The answer tiers are hand-curated estimates—not live crowd rarity data.</p></section>`;document.getElementById('daily-btn').onclick=daily;document.getElementById('practice-btn').onclick=practice}
function daily(){let done=saved();if(done){result(done);return}run={mode:'daily',ids:choose(hash(`claydig-${dateKey}`)),index:0,score:0,records:[]};question()}
function practice(){run={mode:'practice',ids:choose(Math.random()*0xffffffff>>>0),index:0,score:0,records:[]};question()}
function question(){stop();answered=false;let q=QUESTIONS[run.ids[run.index]],n=run.index+1;app.innerHTML=`<section class="game"><div class="game-top"><span class="mode-label">${run.mode==='daily'?'Today’s daily dive':'Practice dive'}</span><button class="quit" id="quit">← Exit</button></div><div class="meta-row"><span>QUESTION ${n} / ${SIZE}</span><span>${run.score.toLocaleString()} m</span></div><div class="progress-track" role="progressbar" aria-label="Round progress" aria-valuemin="0" aria-valuemax="10" aria-valuenow="${n-1}"><div class="progress-bar" style="width:${(n-1)/SIZE*100}%"></div></div><div class="timer-row"><span class="timer" id="timer">◷ <span id="left">${SECONDS}</span> sec</span></div><h2 class="question">${esc(q.q)}</h2><p class="hint">The less-obvious correct answers dig deeper.</p><form class="answer-form" id="form"><input class="answer-input" id="answer" type="text" autocomplete="off" maxlength="80" placeholder="Your answer…" aria-label="Your answer" required><button class="primary" id="submit" type="submit">Dig in ↗</button></form><div class="feedback" id="feedback" role="status" hidden></div><div class="tiers">${NAMES.map((x,i)=>`<span class="tier-chip" data-tier="${i}">${x} · ${POINTS[i]}m</span>`).join('')}</div></section>`;document.getElementById('quit').onclick=home;document.getElementById('form').onsubmit=e=>{e.preventDefault();submit(document.getElementById('answer').value.trim(),false)};document.getElementById('answer').focus();let seconds=SECONDS;tick=setInterval(()=>{seconds--;let el=document.getElementById('left'),timer=document.getElementById('timer');if(!el||answered){stop();return}el.textContent=seconds;if(seconds<=5)timer.classList.add('urgent');if(seconds<=0)submit('',true)},1000)}
function norm(s){return s.toLocaleLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/&/g,' and ').replace(/[^a-z0-9]+/g,' ').trim().replace(/\s+/g,' ')}
function submit(answer,timed){if(!run||answered)return;answered=true;stop();let q=QUESTIONS[run.ids[run.index]],value=norm(answer),tier=value?q.tiers.findIndex(g=>g.some(x=>x&&norm(x)===value)):-1,points=tier>=0?POINTS[tier]:0;run.score+=points;run.records.push({tier,points,answer:answer||''});document.getElementById('answer').disabled=true;let btn=document.getElementById('submit');btn.disabled=true;btn.textContent='Dug!';document.querySelectorAll('.tier-chip').forEach(e=>{if(+e.dataset.tier===tier)e.classList.add('active')});let f=document.getElementById('feedback');f.hidden=false;f.className=`feedback ${tier>=0?'good':'miss'}`;let examples=q.tiers.flat().filter(Boolean).slice(0,5).join(', ');f.innerHTML=tier>=0?`<strong>${NAMES[tier]} · +${points}m</strong>${tier===4?'What a deep cut!':'Nice find.'}`:`<strong>${timed?'Time’s up · +0m':value?'Not in the answer bank · +0m':'No answer · +0m'}</strong>Examples: ${esc(examples)}`;setTimeout(()=>{if(!run)return;run.index++;if(run.index>=SIZE)finish();else question()},1500)}
function finish(){stop();let r={mode:run.mode,date:dateKey,score:run.score,records:run.records,ids:run.ids};if(run.mode==='daily'){try{localStorage.setItem(storageKey,JSON.stringify(r))}catch{}}run=null;result(r)}
function result(r){stop();let depth=r.score,grid=r.records.map((x,i)=>`<div class="result-cell"><strong>${x.tier<0?'—':POINTS[x.tier]+'m'}</strong><small>Q${i+1}</small></div>`).join(''),emoji=r.records.map(x=>x.tier<0?'⬜':['🟫','🟨','🪨','🦴','💎'][x.tier]).join('');app.innerHTML=`<section class="result"><div class="result-emoji">${depth>=7000?'💎':depth>=4000?'🦴':'🪨'}</div><p class="eyebrow">${r.mode==='daily'?'Daily dive complete':'Practice dive complete'}</p><h2>${depth>=7000?'Deep diver!':depth>=4000?'Solid excavation!':'Every dig counts.'}</h2><p class="result-copy">${r.mode==='daily'?'Your daily result is saved in this browser.':'Nice practice run. Try another fresh set whenever you like.'}</p><div class="score-big"><strong>${depth.toLocaleString()}</strong><span>METERS DUG</span></div><div class="result-grid">${grid}</div><p class="result-copy">${emoji}</p><div class="result-actions"><button class="primary" id="share">Share result</button><button class="secondary" id="again">${r.mode==='daily'?'Back home':'New practice run'}</button></div></section>`;document.getElementById('share').onclick=()=>share(r,emoji);document.getElementById('again').onclick=()=>r.mode==='practice'?practice():home()}
async function share(r,emoji){let text=`Claydig ${r.mode==='daily'?'Daily Dive':'Practice Dive'} — ${r.score.toLocaleString()}m\n${emoji}\n${location.href}`;try{if(navigator.share)await navigator.share({title:'My Claydig result',text});else if(navigator.clipboard){await navigator.clipboard.writeText(text);alert('Result copied to clipboard!')}else prompt('Copy your result:',text)}catch(e){if(e.name!=='AbortError')prompt('Copy your result:',text)}}
document.getElementById('home-link').onclick=e=>{e.preventDefault();home()};home();
})();
</script></body></html>
